apiVersion: v1
kind: ConfigMap
metadata:
  name: spendwise-config
  namespace: spendwise
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/spendwise?options=-c%20TimeZone=Asia%2FKolkata
  FASTAPI_BASE_URL: http://ai-service:8000
  CORS_ALLOWED_ORIGIN: http://localhost:3000
  SPRING_JPA_DDL_AUTO: update
---
apiVersion: v1
kind: Secret
metadata:
  name: spendwise-secrets
  namespace: spendwise
type: Opaque
stringData:
  POSTGRES_DB: spendwise
  POSTGRES_USER: spendwise_user
  POSTGRES_PASSWORD: localpass
  JWT_SECRET: SpendWiseAISecretKeyForJWTAuthentication2026Secure
