spring.application.name=backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/spendwise?options=-c%20TimeZone=Asia%2FKolkata}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:spendwise_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:localpass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}

backend\src\main\java\com\spendwise\backend\security\JwtService.java
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
